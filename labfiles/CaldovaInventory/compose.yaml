services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: caldova-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Caldova_Local_2026!"
    ports:
      - "14333:1433"
    volumes:
      - caldova-sql-data:/var/opt/mssql
      - ./scripts:/scripts:ro
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Caldova_Local_2026!" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  caldova-sql-data:
