# SQL01: SQL Server 2022 for the Caldova modernization lab.
# The container runs inside the development container (Docker-in-Docker) and
# publishes port 1433. .devcontainer/post-start.sh maps the host name SQL01 to
# 127.0.0.1 so that the starter application can use Server=SQL01,1433.
#
# The sa password is the synthetic lab credential that the starter Program.cs
# hard-codes on purpose. Use it only for this local container.
name: caldova-lab

services:
  sql01:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: sql01
    hostname: SQL01
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - sql01-data:/var/opt/mssql
      - ./labfiles/CaldovaInventory/scripts:/scripts:ro
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" -o /dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  sql01-data:
